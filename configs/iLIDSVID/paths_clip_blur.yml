# Paths: iLIDS-VID blur, CLIP-B/16 backbone (Table 3, Paths*)
MODEL:
  TRANSFORMER_TYPE: 'ViT-B-16'
  STRIDE_SIZE: [16, 16]
  SIE_CAMERA: True
  SIE_COE: 1.0
  ID_LOSS_WEIGHT: 0.25
  TRIPLET_LOSS_WEIGHT: 1.0
  HEAD: 8
  USE_MAB: False
  USE_PST: True
  USE_HMF: True
  PST_SEQ_LEN: 8
  PST_START_LAYER: 0
  PST_PROMPT_LEN: 8
  PST_PROMPT_GROUPS: 2
INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  SEQ_LEN: 8
  MIN_SEQ_LEN: 0
DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 14
DATASETS:
  NAMES: 'iLIDSVID'
  ROOT_DIR: 'datasets/i-LIDS-VID'
  EVENT_ROOT: 'datasets/i-LIDS-VID/i-LIDS-VID_mat_divide_jpg'
  DEGRADE: 'blur'
  SPLIT_ID: 0
SOLVER:
  BASE_LR: 0.0005
  WARMUP_FACTOR: 0.1
  WARMUP_ITERS: 10
  MAX_EPOCHS: 80
  STEPS: [30, 50, 70]
  OPTIMIZER_NAME: 'Adam'
  IMS_PER_BATCH: 32
  EVAL_PERIOD: 1
  EVAL_FIRST_N_EPOCHS: 2
  EVAL_LAST_N_EPOCHS: 50
TEST:
  IMS_PER_BATCH: 64
  RE_RANKING: 'no'
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
OUTPUT_DIR: 'logs/iLIDSVID_blur_CLIP'
