# Paths: Table 6 row 4: full model without the cross-modal alignment loss
MODEL:
  TRANSFORMER_TYPE: 'dinov3_vitb16'
  PRETRAIN_PATH_T: 'pretrained/Dinov3.pth'
  STRIDE_SIZE: [ 16, 16 ]
  SIE_CAMERA: True
  SIE_COE: 1.0
  ID_LOSS_WEIGHT: 0.25
  TRIPLET_LOSS_WEIGHT: 1.0
  HEAD: 8
  USE_MAB: True
  USE_PST: True
  USE_HMF: True
  PST_SEQ_LEN: 8
  PST_START_LAYER: 0
  PST_PROMPT_LEN: 8
  PST_PROMPT_GROUPS: 2
  FRAME_LOSS_WEIGHT: 0.2
  MAB_LOSS_WEIGHT: 0.3
  HMF_ALIGN_LOSS_WEIGHT: 0.0
  CM_SUPCON_LOSS_WEIGHT: 0.2
INPUT:
  SIZE_TRAIN: [ 256, 128 ]
  SIZE_TEST: [ 256, 128 ]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  SEQ_LEN: 8
DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 14
DATASETS:
  NAMES: 'EvReID'
  ROOT_DIR: 'datasets/EvReID/rgb_degrade'
  TRACK_INFO: 'datasets/EvReID/info/tracks_train_info.mat'
SOLVER:
  BASE_LR: 0.0005
  WARMUP_FACTOR: 0.1
  WARMUP_ITERS: 10
  MAX_EPOCHS: 80
  STEPS: [30, 50, 70]
  OPTIMIZER_NAME: 'Adam'
  IMS_PER_BATCH: 64
  EVAL_PERIOD: 1
TEST:
  IMS_PER_BATCH: 64
  RE_RANKING: 'no'
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
  DENSE_EVAL: False
OUTPUT_DIR: 'logs/ablation/t6_row4_no_align'
